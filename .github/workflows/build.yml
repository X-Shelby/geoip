name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          echo "TAG_NAME=latest" >> $GITHUB_ENV
          echo "RELEASE_NAME=Latest Update ($(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M'))" >> $GITHUB_ENV
        shell: bash

      - name: Download GeoLite2 databases
        env:
          LICENSE_KEY: ${{ secrets.MAXMIND_GEOLITE2_LICENSE }}
        run: |
          mkdir -p output
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-ASN-CSV&license_key=${LICENSE_KEY}&suffix=zip" -o ./output/GeoLite2-ASN-CSV.zip
          curl -L "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country-CSV&license_key=${LICENSE_KEY}&suffix=zip" -o ./output/GeoLite2-Country-CSV.zip

      - name: Prepare GeoLite2 databases
        run: |
          unzip -o ./output/GeoLite2-Country-CSV.zip -d ./
          unzip -o ./output/GeoLite2-ASN-CSV.zip -d ./
          mkdir -p geolite2
          cp GeoLite2-Country-CSV_*/*.csv ./geolite2/
          cp GeoLite2-ASN-CSV_*/*.csv ./geolite2/

      - name: Build geoip files
        run: |
          go build ./
          ./geoip convert -c ./config.json

      - name: Extract targets and clean output
        run: |
          cd output || exit 1
          # 1. 提取基础文本和编译格式
          cp text_v4/cn.txt ./cn_v4.txt 2>/dev/null || true
          cp text_v6/cn.txt ./cn_v6.txt 2>/dev/null || true
          cp text_all/cn.txt ./cn.txt 2>/dev/null || true
          cp srs_v4/cn.srs ./cn_v4.srs 2>/dev/null || true
          cp srs_v6/cn.srs ./cn_v6.srs 2>/dev/null || true
          cp srs/cn.srs ./cn.srs 2>/dev/null || true
          cp srs/cn.srs ./cnip_all.srs 2>/dev/null || true
          cp mrs_v4/cn.mrs ./cn_v4.mrs 2>/dev/null || true
          cp mrs_v6/cn.mrs ./cn_v6.mrs 2>/dev/null || true
          cp mrs/cn.mrs ./cn.mrs 2>/dev/null || true
          cp mrs/cn.mrs ./cnip_all.mrs 2>/dev/null || true

          # 2. 使用 Python 脚本自动将 TXT 转换生成 sing-box 标准 JSON 规则集
          python3 -c '
          import json, os

          def convert_txt_to_json(txt_path, json_path):
              if not os.path.exists(txt_path):
                  return
              ip_rules = []
              with open(txt_path, "r") as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith("#"):
                          ip_rules.append(line)
              
              rule_set = {
                  "version": 3,
                  "rules": [
                      {
                          "ip_cidr": ip_rules
                      }
                  ]
              }
              with open(json_path, "w") as f:
                  json.dump(rule_set, f, indent=2)

          convert_txt_to_json("cn_v4.txt", "cn_v4.json")
          convert_txt_to_json("cn_v6.txt", "cn_v6.json")
          convert_txt_to_json("cn.txt", "cn.json")
          convert_txt_to_json("cn.txt", "cnip_all.json")
          '

          # 3. 清理不需要的中间文件夹
          find . -maxdepth 1 -type d ! -path . -exec rm -rf {} +
          find . -maxdepth 1 -type f ! -name 'cn*' -delete

      - name: Push to release branch (Fixed Link)
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add cn_v4.txt cn_v6.txt cn.txt cn_v4.srs cn_v6.srs cn.srs cnip_all.srs cn_v4.mrs cn_v6.mrs cn.mrs cnip_all.mrs cn_v4.json cn_v6.json cn.json cnip_all.json
          git commit -m "Auto-update: ${{ env.RELEASE_NAME }}"
          git push -f "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" release

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd output || exit 1
          gh release delete latest --repo ${{ github.repository }} --cleanup-tag --yes 2>/dev/null || true
          sleep 2
          gh release create latest \
            --repo ${{ github.repository }} \
            --target release \
            --title "${{ env.RELEASE_NAME }}" \
            --notes "固定下载链接：
          - IPv4 (TXT): https://github.com/${{ github.repository }}/releases/download/latest/cn_v4.txt
          - IPv6 (TXT): https://github.com/${{ github.repository }}/releases/download/latest/cn_v6.txt
          - 合并 (TXT): https://github.com/${{ github.repository }}/releases/download/latest/cn.txt
          - sing-box IPv4 (SRS): https://github.com/${{ github.repository }}/releases/download/latest/cn_v4.srs
          - sing-box IPv6 (SRS): https://github.com/${{ github.repository }}/releases/download/latest/cn_v6.srs
          - sing-box 合并 (SRS): https://github.com/${{ github.repository }}/releases/download/latest/cn.srs
          - sing-box 别名 (SRS): https://github.com/${{ github.repository }}/releases/download/latest/cnip_all.srs
          - sing-box IPv4 规则 (JSON): https://github.com/${{ github.repository }}/releases/download/latest/cn_v4.json
          - sing-box IPv6 规则 (JSON): https://github.com/${{ github.repository }}/releases/download/latest/cn_v6.json
          - sing-box 合并 规则 (JSON): https://github.com/${{ github.repository }}/releases/download/latest/cn.json
          - sing-box 别名 规则 (JSON): https://github.com/${{ github.repository }}/releases/download/latest/cnip_all.json
          - Mihomo IPv4 (MRS): https://github.com/${{ github.repository }}/releases/download/latest/cn_v4.mrs
          - Mihomo IPv6 (MRS): https://github.com/${{ github.repository }}/releases/download/latest/cn_v6.mrs
          - Mihomo 合并 (MRS): https://github.com/${{ github.repository}}/.github/releases/download/latest/cn.mrs
          - Mihomo 别名 (MRS): https://github.com/${{ github.repository }}/releases/download/latest/cnip_all.mrs" \
            ./cn_v4.txt ./cn_v6.txt ./cn.txt \
            ./cn_v4.srs ./cn_v6.srs ./cn.srs ./cnip_all.srs \
            ./cn_v4.mrs ./cn_v6.mrs ./cn.mrs ./cnip_all.mrs \
            ./cn_v4.json ./cn_v6.json ./cn.json ./cnip_all.json

      - name: Purge jsdelivr CDN
        run: |
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v4.txt"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v6.txt"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn.txt"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v4.srs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v6.srs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn.srs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cnip_all.srs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v4.mrs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v6.mrs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn.mrs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cnip_all.mrs"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v4.json"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn_v6.json"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cn.json"
          curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/cnip_all.json"
